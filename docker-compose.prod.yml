# 운영(EC2)용. 개발용 docker-compose.yml과 달리 DB, Redis 포트를 밖에 열지 않고 80번만 연다
# 비밀값은 같은 폴더의 .env 에서 읽는다 (.env.prod.example 참고)
services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app, grafana]
    restart: unless-stopped
  app:
    image: ghcr.io/sihwan0802/market-settlement:latest
    mem_limit: 900m
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/market}
      DB_USER: ${DB_USER:-market}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: ${DB_USER:-market}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    mem_limit: 256m
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    depends_on: [app]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    mem_limit: 300m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
  prom_data:
  grafana_data:
