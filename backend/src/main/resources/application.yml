spring:
  application:
    name: market
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market}
    username: ${DB_USER:market}
    password: ${DB_PASSWORD:market}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # 캐시 장애가 조회를 오래 붙잡지 않도록 짧게 둔다
      timeout: 200ms
      connect-timeout: 200ms
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt:
    # 개발용 기본값. 배포 환경에서는 JWT_SECRET 환경변수로 32바이트 이상 값을 주입
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789}
  portone:
    base-url: https://api.portone.io
    api-secret: ${PORTONE_API_SECRET:}
    # 웹훅 서명 검증용 시크릿(콘솔의 whsec_...). 비어 있으면 웹훅을 모두 거부한다
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  notify:
    # 정산 결과를 받을 Apps Script 웹 앱 주소(?token= 포함). 비어 있으면 알림을 보내지 않는다
    webhook-url: ${NOTIFY_WEBHOOK_URL:}
  cache:
    product-ttl-seconds: 30
  rate-limit:
    order-limit: 5
    order-window-seconds: 10
    login-limit: 10
    login-window-seconds: 60
  refund:
    recover-after-minutes: 10
    recover-check-ms: 60000
  order:
    expire-minutes: 30
    expire-check-ms: 60000
management:
  endpoints:
    web:
      exposure:
        # prometheus는 인증 없이 열려 있으므로 앞단(Caddy)에서 막는다 (deploy/Caddyfile)
        include: health,prometheus
  metrics:
    tags:
      application: market
    distribution:
      # 요청 지연의 p95를 Prometheus에서 계산하려면 버킷이 필요하다
      percentiles-histogram:
        http.server.requests: true
