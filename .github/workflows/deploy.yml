name: Deploy

# CI가 main에서 성공한 뒤에만 실행. 서버에는 SSM으로 명령을 보내므로 SSH 포트도 저장된 키도 없다
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # AWS OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드와 푸시
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE:latest -t $IMAGE:${{ github.event.workflow_run.head_sha || github.sha }} backend
          docker push --all-tags $IMAGE

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 서버에 배포하고 health 확인
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          {
            echo "set -e"
            echo "echo $(base64 -w0 docker-compose.prod.yml) | base64 -d > /home/ubuntu/market/docker-compose.yml"
            echo "echo $(base64 -w0 deploy/Caddyfile) | base64 -d > /home/ubuntu/market/deploy/Caddyfile"
            cat deploy/remote-deploy.sh
          } > script.sh
          jq -n --rawfile s script.sh '{commands: [$s]}' > params.json
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file://params.json \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query Status --output text)" = Success
